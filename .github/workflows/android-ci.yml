name: Android CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Test and build debug APK
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install pinned Android SDK packages
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up pinned Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.6.0'
          cache-provider: basic

      - name: Show build tool versions
        run: |
          java --version
          gradle --version
          sdkmanager --list_installed

      - name: Run unit tests and build debug APK
        run: >-
          gradle --no-daemon --stacktrace --console=plain
          clean
          :filter-core:test
          :demo-app:lintDebug
          :demo-app:assembleDebug

      - name: Write build metadata
        if: success()
        run: |
          mkdir -p build-artifacts
          {
            echo "version=0.2.2-direct-media-picker"
            echo "commit=${GITHUB_SHA}"
            echo "run=${GITHUB_RUN_NUMBER}"
            echo "built_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          } > build-artifacts/build-info.txt

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: filterbridge-lab-debug-apk-${{ github.run_number }}
          path: |
            demo-app/build/outputs/apk/debug/*.apk
            build-artifacts/build-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: filterbridge-test-reports-${{ github.run_number }}
          path: |
            filter-core/build/reports/tests/test/
            filter-core/build/test-results/test/
          if-no-files-found: ignore
          retention-days: 14
