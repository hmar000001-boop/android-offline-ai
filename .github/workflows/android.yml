name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Verify source and build debug APK
        run: gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
          if-no-files-found: ignore
          retention-days: 14
