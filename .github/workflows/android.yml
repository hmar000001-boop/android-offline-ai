name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install Android SDK platform and build tools
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Verify source and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results*
            build/reports/problems/problems-report.html
            app/build/reports/problems/problems-report.html
            build-output.log
          if-no-files-found: ignore
          retention-days: 14


  emulator-lifecycle:
    name: Accessibility lifecycle · API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: platform-tools

      - name: Install compile and emulator SDK components
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "platforms;android-${{ matrix.api-level }}" \
            "emulator" \
            "system-images;android-${{ matrix.api-level }};google_apis;x86_64"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Accessibility lifecycle tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # android-emulator-runner executes this block through /bin/sh, not Bash.
          # Use POSIX shell syntax and preserve Gradle's exit code without pipefail.
          script: |
            if gradle --no-daemon connectedDebugAndroidTest --stacktrace > emulator-tests.log 2>&1; then
              gradle_status=0
            else
              gradle_status=$?
            fi
            cat emulator-tests.log
            exit "$gradle_status"

      - name: Upload emulator lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-emulator-api-${{ matrix.api-level }}-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            emulator-tests.log
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 14
