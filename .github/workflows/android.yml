name: Android APK

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK platform and build tools (retry on bad downloads)
        run: |
          bash scripts/install-android-sdk-with-retries.sh \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Check pinned Activity Result Fragment dependency
        run: bash scripts/verify-fragment-activity-result-dependency.sh

      - name: Verify Activity Result Fragment dependency resolution
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon :app:dependencyInsight \
            --dependency androidx.fragment:fragment \
            --configuration debugRuntimeClasspath 2>&1 | tee fragment-dependency.log
          grep -Eq 'androidx\.fragment:fragment:1\.9\.1([[:space:]]|$)' fragment-dependency.log

      - name: Verify source and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon clean testDebugUnitTest lintDebug assembleDebug --stacktrace 2>&1 | tee build-output.log

      - name: Verify 16 KB native-library alignment in debug APK
        run: bash scripts/verify-16k-native-libs.sh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-debug-apk-NOT-FOR-DAILY-USE
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-build-reports
          path: |
            sdkmanager-install-attempt-*.log
            app/build/reports/tests/
            app/build/reports/lint-results*
            build/reports/problems/problems-report.html
            app/build/reports/problems/problems-report.html
            build-output.log
            fragment-dependency.log
          if-no-files-found: ignore
          retention-days: 14


  release-build:
    name: Release build (R8) and signing check
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install Android SDK platform and build tools (retry on bad downloads)
        run: |
          bash scripts/install-android-sdk-with-retries.sh \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Decode release keystore (only when secrets are configured)
        env:
          KEYSTORE_B64: ${{ secrets.SCREENVEIL_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/screenveil-release.jks"
            echo "SCREENVEIL_KEYSTORE_FILE=$RUNNER_TEMP/screenveil-release.jks" >> "$GITHUB_ENV"
            echo "SCREENVEIL_KEYSTORE_PASSWORD=${{ secrets.SCREENVEIL_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "SCREENVEIL_KEY_ALIAS=${{ secrets.SCREENVEIL_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "SCREENVEIL_KEY_PASSWORD=${{ secrets.SCREENVEIL_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "No signing secrets: the release APK will be unsigned (still validates R8)."
          fi

      - name: Build release APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease --stacktrace 2>&1 | tee release-build.log

      - name: Verify 16 KB native-library alignment in release APK
        shell: bash
        run: |
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          if [[ -z "$release_apk" ]]; then
            echo 'ERROR: release APK was not produced.' >&2
            exit 1
          fi
          bash scripts/verify-16k-native-libs.sh "$release_apk"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-release-apk
          path: |
            sdkmanager-install-attempt-*.log
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt
            release-build.log
          if-no-files-found: error
          retention-days: 14

  verify-model-pins:
    name: Verify pinned model artifacts (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Download every pinned artifact and compare SHA-256
        run: python3 scripts/verify-model-pins.py --download

  emulator-lifecycle:
    name: Accessibility lifecycle · API ${{ matrix.api-level }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api-level: [34, 36]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 12266719
          accept-android-sdk-licenses: true
          packages: ''

      - name: Install compile and emulator SDK components (retry on bad downloads)
        run: |
          api_level="${{ matrix.api-level }}"
          sdk_packages=(
            "platforms;android-36"
            "build-tools;36.0.0"
            "build-tools;37.0.0"
            "platform-tools"
            "emulator"
            "system-images;android-${api_level};google_apis;x86_64"
          )
          if [[ "$api_level" != "36" ]]; then
            sdk_packages+=("platforms;android-${api_level}")
          fi
          bash scripts/install-android-sdk-with-retries.sh "${sdk_packages[@]}"

      - name: Set up pinned Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.6'

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Identify checked-out ScreenVeil CI source
        run: |
          echo "SCREENVEIL_CI_CHECKOUT_SHA=$(git rev-parse HEAD)"
          sha256sum scripts/run-emulator-tests.sh scripts/install-test-app-with-grants.sh app/build.gradle.kts

      - name: Run Accessibility lifecycle tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: ${{ matrix.api-level }}
          target: google_apis
          arch: x86_64
          profile: pixel_7_pro
          ram-size: 4096M
          heap-size: 512M
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          # This action splits `script` at newlines and runs each line separately
          # through `sh -c`. Keep this as ONE command; the Bash logic lives in a file.
          script: bash scripts/run-emulator-tests.sh

      - name: Print emulator test log
        if: always()
        run: |
          if [ -f emulator-tests.log ]; then
            cat emulator-tests.log
          else
            echo "No emulator-tests.log was produced."
          fi

      - name: Upload emulator lifecycle reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenveil-emulator-api-${{ matrix.api-level }}-reports
          path: |
            sdkmanager-install-attempt-*.log
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            app/build/outputs/connected_android_test_additional_output/
            app/build/outputs/apk/androidTest/debug/*.apk
            build/instrumentation-runtime-diagnostics/**
            build/emulator-failure-diagnostics/**
            build/emulator-preflight-failure/**
            instrumentation-runtime-diagnostics.log
            permission-preflight.log
            emulator-tests.log
            build/reports/problems/problems-report.html
          if-no-files-found: ignore
          retention-days: 14
